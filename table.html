<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    <h2> HTML TABLE TAG EXAMPLE </h2>
    <table border="1.5">
        <caption > student marks </caption>
        <colgroup>
            <col style="background-color: rgb(239, 14, 183);">
            <col style="background-color: rgb(111, 48, 236);">
            <col style="background-color: rgb(51, 6, 249);">
        </colgroup>
        <tr>
            <th>student name: </th>
            <th>marks </th>
        </tr>
<tr>
                <td rowspan=" 2">jaggu bhai</td>
                <td>HTML</td>
                <td>80</td>
            </tr>
            
               
                <td>CSS</td>
                <td>90</td>
            </tr>
            <tr>
                <td rowspan="2">jagadesh</td>
                <td>java</td>
                <td>98</td>
            </tr>
            <tr>
                
                <td>eng</td>
                <td>99</td>
            </tr>
            <tr>
                <td colspan="2"> Total Students</td>
                
                <td>2</td>
            </tr>
            
        </table>
</body>
</html>
